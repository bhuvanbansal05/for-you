<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Your Smile</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #fbe9e7, #fff8e1);
      color: #4e342e;
      text-align: center;
      padding: 3em;
    }
    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 3em;
      color: #d84315;
    }
    p {
      font-size: 1.4em;
      max-width: 800px;
      margin: 2em auto;
      line-height: 1.8;
    }
    a {
      display: inline-block;
      margin-top: 2em;
      padding: 0.8em 1.5em;
      background: #d84315;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.3s;
    }
    a:hover {
      background: #bf360c;
    }
    .emoji {
      font-size: 2em;
      margin: 1em 0;
    }
  </style>
</head>
<body>
  <h1>For Your Smile 😊</h1>
  <p class="emoji">🌼🌈🐻🍩🧸🍓</p>
  <p>
    Here's a virtual hug, a sprinkle of laughter, and a pocketful of sunshine 🌞 just for you.<br>
    Because your smile lights up everything, and I’ll do whatever I can to keep it shining.
  </p>
  <p class="emoji">💕💫🐱🍰💐🎀</p>
  <a href="index.html">Back to Home</a>
</body>
</html>
