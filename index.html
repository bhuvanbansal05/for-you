<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Someone Special</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #fceabb, #f8b500);
      font-family: 'Roboto', sans-serif;
      color: #333;
      text-align: center;
      overflow: hidden;
    }
    h1 {
      font-family: 'Pacifico', cursive;
      margin-top: 2em;
      font-size: 3em;
      color: #d32f2f;
    }
    p {
      font-size: 1.5em;
      margin: 1em auto;
      max-width: 700px;
      line-height: 1.6;
    }
    nav a {
      display: inline-block;
      margin: 1em;
      padding: 1em 2em;
      background-color: #fff;
      color: #d32f2f;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
      transition: 0.3s;
    }
    nav a:hover {
      background-color: #d32f2f;
      color: #fff;
    }
    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }
    .heart {
      width: 20px;
      height: 20px;
      position: absolute;
      background: red;
      transform: rotate(45deg);
      animation: float 10s linear infinite;
    }
    .heart::before,
    .heart::after {
      content: '';
      width: 20px;
      height: 20px;
      position: absolute;
      background: red;
      border-radius: 50%;
    }
    .heart::before {
      top: -10px;
      left: 0;
    }
    .heart::after {
      left: -10px;
      top: 0;
    }
    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(45deg);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) rotate(45deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>You Are Loved 💖</h1>
  <p>You are strong, you are special, and I promise to always be there for you. This is my heart to yours.</p>
  <nav>
    <a href="strong.html">You Are Strong</a>
    <a href="special.html">You Are Special</a>
    <a href="promise.html">My Promise</a>
    <li><a href="for-your-smile-animated.html">For Your Smile</a></li>
  </nav>
  <div class="hearts">
    ${''.join(f'<div class="heart" style="left:{i * 5}%; top:{i * -10}px;"></div>' for i in range(1, 21))}
  </div>
</body>
</html>
